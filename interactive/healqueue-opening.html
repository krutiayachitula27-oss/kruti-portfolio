<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heal Queue — Opening</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#DCEBF4;--ink:#002F42;--mute:#3f6577;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071b24;--ink:#dcebf4;--mute:#9EC5DD}}
:root[data-theme="dark"]{--bg:#071b24;--ink:#dcebf4;--mute:#9EC5DD}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,"Noto Sans Devanagari","Noto Sans Kannada",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7FCCC4;outline-offset:2px}
.top{display:flex;justify-content:center;padding:20px 16px 0}
.top button{border:1px solid var(--mute);background:none;border-radius:999px;padding:8px 18px;min-height:44px}
.stage{display:flex;justify-content:center;padding:20px 16px 48px}
.ph{width:100%;max-width:380px;height:740px;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;background:#9EC5DD;color:#002F42;box-shadow:0 24px 50px -28px #000a;position:relative}
/* splash */
.sp{flex:1;background:#002F42;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;border:0;width:100%;text-align:center}
.q{display:flex;align-items:center;gap:10px;height:44px}
.q i{width:20px;height:20px;border-radius:50%;background:#9EC5DD;opacity:.45;animation:out .5s ease forwards}
.q i:nth-child(1){animation-delay:.5s}.q i:nth-child(2){animation-delay:.8s}.q i:nth-child(3){animation-delay:1.1s}.q i:nth-child(4){animation-delay:1.4s}
.q b{background:#7FCCC4;color:#002F42;border-radius:22px;height:44px;padding:0 20px;display:flex;align-items:center;font-size:1.3rem;letter-spacing:.02em}
@keyframes out{to{width:0;margin-right:-10px;opacity:0}}
.wm{opacity:0;animation:in .7s ease 1.7s forwards}
.wm h1{margin:0;font-size:2.6rem;letter-spacing:-.02em;line-height:1.1}
.wm p{margin:8px 0 0;color:#9EC5DD;font-size:1.1rem}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.q i{animation:none;display:none}.wm{animation:none;opacity:1}}
/* welcome */
.hd{background:#002F42;color:#fff;padding:20px 22px 70px;display:flex;justify-content:space-between;align-items:center}
.mk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem}
.mk span{background:#7FCCC4;color:#002F42;border-radius:12px;padding:2px 10px}
.sc{flex:1;overflow:auto;padding:0 18px 20px;margin-top:-52px}
.tk{background:#fff;border-radius:22px;padding:22px 20px;position:relative}
.tk:after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;border-bottom:3px dotted #9EC5DD}
h2{margin:0 0 8px;font-size:1.65rem;line-height:1.15;color:#002F42}
.mu{color:#3f6577;margin:0}
.lab{display:block;font-weight:700;margin:20px 2px 8px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.ch button{flex:1;border:2px solid #005E85;background:#fff;border-radius:16px;padding:10px 8px;min-height:52px;font-size:1.05rem}
.ch button[aria-pressed="true"]{background:#005E85;color:#fff;font-weight:700}
.ph-in{display:flex;background:#fff;border-radius:16px;border:2px solid #005E85;overflow:hidden;min-height:54px}
.ph-in span{display:grid;place-content:center;padding:0 14px;background:#DCEBF4;font-weight:700}
.ph-in input{flex:1;min-width:0;border:0;padding:0 14px;font-size:1.15rem;background:none;letter-spacing:.06em}
.btn{display:block;width:100%;border:0;background:#002F42;color:#fff;border-radius:16px;padding:15px;min-height:54px;font-weight:700;margin-top:12px;font-size:1.05rem}
.btn:disabled{background:#7FCCC4;color:#002F42}
.note{background:#fff;border-radius:18px 18px 18px 6px;padding:14px 16px;margin-top:16px}
.ok{background:#7FCCC4;border-radius:16px;padding:12px 14px;margin-top:12px;font-weight:700}
</style>
</head>
<body>
<div class="top"><button id="rp">Replay opening</button></div>
<main class="stage"><div class="ph" id="ph"></div></main>
<script>
const D={
tag:["Less wait, better care.","कम इंतज़ार, बेहतर देखभाल।","ಕಡಿಮೆ ಕಾಯುವಿಕೆ, ಉತ್ತಮ ಆರೈಕೆ."],
wt:["Welcome to Heal Queue","हील क्यू में आपका स्वागत है","ಹೀಲ್ ಕ್ಯೂಗೆ ಸ್ವಾಗತ"],
ws:["Know where you stand in line, book visits and keep your reports in one place.","कतार में अपनी जगह जानें, विज़िट बुक करें और रिपोर्ट एक जगह रखें।","ಸರದಿಯಲ್ಲಿ ನಿಮ್ಮ ಸ್ಥಾನ ತಿಳಿಯಿರಿ, ಭೇಟಿ ಬುಕ್ ಮಾಡಿ, ವರದಿಗಳನ್ನು ಒಂದೇ ಕಡೆ ಇಡಿ."],
lg:["Choose your language","अपनी भाषा चुनें","ನಿಮ್ಮ ಭಾಷೆ ಆಯ್ಕೆಮಾಡಿ"],
mb:["Mobile number","मोबाइल नंबर","ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"],
ct:["Continue","आगे बढ़ें","ಮುಂದುವರಿಸಿ"],
sent:["Code sent to +91 {n}","+91 {n} पर कोड भेजा गया","+91 {n} ಗೆ ಕೋಡ್ ಕಳುಹಿಸಲಾಗಿದೆ"],
as:["No smartphone? Ask at reception for a printed token.","स्मार्टफ़ोन नहीं है? रिसेप्शन पर छपा टोकन माँगें।","ಸ್ಮಾರ್ಟ್‌ಫೋನ್ ಇಲ್ಲವೇ? ಸ್ವಾಗತ ಕೌಂಟರ್‌ನಲ್ಲಿ ಮುದ್ರಿತ ಟೋಕನ್ ಕೇಳಿ."]};
const L=["en","hi","kn"],names=["English","हिन्दी","ಕನ್ನಡ"];
const S={scr:"splash",lang:0,num:"",sent:false};let timer;
const t=(k,r={})=>{let s=D[k][S.lang];for(const x in r)s=s.replace("{"+x+"}",r[x]);return s};
function render(){
  document.documentElement.lang=L[S.lang];
  const p=document.getElementById("ph");clearTimeout(timer);
  if(S.scr==="splash"){
    p.innerHTML=`<button class="sp" id="skip" aria-label="Heal Queue"><div class="q"><i></i><i></i><i></i><i></i><b>A37</b></div><div class="wm"><h1>Heal Queue</h1><p>${t("tag")}</p></div></button>`;
    timer=setTimeout(()=>{S.scr="welcome";render()},3600);return}
  const ok=S.num.length===10;
  p.innerHTML=`<div class="hd"><div class="mk"><span>HQ</span>Heal Queue</div></div>
  <div class="sc"><div class="tk"><h2>${t("wt")}</h2><p class="mu">${t("ws")}</p>
  <b class="lab">${t("lg")}</b><div class="ch">${names.map((n,i)=>`<button data-l="${i}" aria-pressed="${S.lang===i}">${n}</button>`).join("")}</div>
  <label class="lab" for="m">${t("mb")}</label><div class="ph-in"><span>+91</span><input id="m" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="${S.num}" placeholder="98765 43210"></div>
  ${S.sent?`<div class="ok" role="status">${t("sent",{n:S.num})}</div>`:""}
  <button class="btn" id="go" ${ok?"":"disabled"}>${t("ct")}</button></div>
  <div class="note">${t("as")}</div></div>`;
  const i=document.getElementById("m");
  i.oninput=e=>{S.num=e.target.value.replace(/\D/g,"");S.sent=false;e.target.value=S.num;document.getElementById("go").disabled=S.num.length!==10;const o=document.querySelector(".ok");if(o)o.remove()};
}
document.body.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="skip"){S.scr="welcome"}
  else if(b.id==="rp"){Object.assign(S,{scr:"splash",num:"",sent:false})}
  else if(b.dataset.l){S.lang=+b.dataset.l}
  else if(b.id==="go"){S.sent=true}
  else return;
  render();
});
render();
</script>
</body>
</html>
