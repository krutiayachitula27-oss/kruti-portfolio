<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bear House CRM Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: journey rail with stage bars on top, then the store photo with numbered VM pins beside one stage card (metric to watch). Palette sampled from the store photos: bear-figurine red, warm cream walls and light wood, denim navy, sage and blush from the shirt walls. */
:root{
  --font:'Jost','Helvetica Neue',Arial,sans-serif;
  --bg:#f2e9da;--card:#fbf6ec;--ink:#2a211b;--muted:#75665a;--line:#e0d1b8;--sand:#e8d8bd;
  --red:#dc2419;--red-d:#a8130f;--on-red:#ffffff;--tint:#f8ddd2;--navy:#242f45;--bar:#5b6f8f;--good:#3f6b4a;
  --pinbg:rgba(255,251,243,.95);--shadow:0 8px 30px rgba(60,38,20,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17120f;--card:#221a15;--ink:#f4ece0;--muted:#b8a794;--line:#3b2f26;--sand:#3b2f26;
  --red:#ff4a3d;--red-d:#ff9a90;--on-red:#1d0a07;--tint:#3a1c18;--navy:#cfdaf0;--bar:#7f97bd;--good:#8fc29a;
  --pinbg:rgba(34,26,21,.94);--shadow:0 8px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120f;--card:#221a15;--ink:#f4ece0;--muted:#b8a794;--line:#3b2f26;--sand:#3b2f26;
  --red:#ff4a3d;--red-d:#ff9a90;--on-red:#1d0a07;--tint:#3a1c18;--navy:#cfdaf0;--bar:#7f97bd;--good:#8fc29a;
  --pinbg:rgba(34,26,21,.94);--shadow:0 8px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,p{margin:0}

.head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none;width:38px;height:38px;fill:var(--red)}
.brand small{display:block;font-size:12px;letter-spacing:3px;font-weight:600;color:var(--red)}
.brand h1{font-size:clamp(24px,4vw,32px);font-weight:600;line-height:1.1}
.tag{border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;background:var(--card)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}

/* journey rail */
.journey{padding:18px 10px 10px}
.jgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;position:relative}
.jgrid::before{content:"";position:absolute;left:8.33%;right:8.33%;top:22px;height:2px;background:var(--line)}
.col{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.circ{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s,color .25s}
.circ svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nm{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gp{min-height:18px;font-size:11px;font-weight:700;color:var(--red);background:var(--tint);border-radius:6px;padding:1px 7px;letter-spacing:.5px}
.gp:empty{visibility:hidden}
.bar{width:100%;height:132px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-bottom:2px solid var(--line)}
.bv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bf{display:block;width:min(56%,58px);background:var(--bar);border-radius:6px 6px 0 0;transition:background .25s}
.col.on .circ{background:var(--red);border-color:var(--red);color:var(--on-red)}
.col.on .nm,.col.on .bv{color:var(--red)}
.col.on .bf{background:var(--red)}
.col:hover .circ{border-color:var(--red)}
.loop{position:relative;height:34px;margin-top:4px}
.loop svg{position:absolute;inset:0;width:100%;height:100%}
.loop path{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.loop .la{position:absolute;left:8.33%;top:-8px;transform:translateX(-50%);color:var(--muted);font-size:12px;line-height:1}
.loop .lt{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);background:var(--card);padding:0 10px;font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.shots{display:grid;gap:10px;transition:opacity .2s}
.shots.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:560px){.shots.n2{grid-template-columns:minmax(0,1fr)}}
.shots.fade{opacity:0}
.shot{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--sand)}
.shot img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:0;padding:0;background:var(--red);color:var(--on-red);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.4);transition:transform .15s}
.pin::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--red);opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.7);opacity:.85}100%{transform:scale(1.8);opacity:0}}
.pin b{font-weight:700}
.pin span{position:absolute;top:50%;transform:translateY(-50%);background:var(--pinbg);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.22);transition:background .15s,color .15s}
.pin.r span{left:32px}
.pin.l span{right:32px}
.pin.hot{transform:translate(-50%,-50%) scale(1.18);z-index:3}
.pin.hot span{background:var(--red);color:var(--on-red)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media(min-width:901px){.panel{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}}
.ph{display:flex;align-items:center;gap:14px}
.pn{font-size:56px;font-weight:700;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.ph h2{font-size:26px;font-weight:600;letter-spacing:2px;text-transform:uppercase;line-height:1.1}
.ph p{color:var(--muted);margin-top:2px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px 4px 4px;font-size:14px;font-weight:500;transition:background .15s,border-color .15s}
.chips li b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--red);color:var(--on-red);font-size:12px;display:flex;align-items:center;justify-content:center}
.chips li.hot{border-color:var(--red);background:var(--tint)}
.kpi{background:var(--bg);border-radius:14px;padding:14px 16px}
.kv{font-size:46px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;border-radius:5px;background:var(--sand);margin:10px 0 6px}
.kfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--bar);transition:width .5s}
.ktick{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.krow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.kchip{font-weight:700;border-radius:99px;padding:3px 10px;background:var(--sand);color:var(--ink)}
.kchip.ok{background:var(--good);color:var(--card)}
.kchip.bad{background:var(--red);color:var(--on-red)}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.nav button:hover{border-color:var(--red)}
.nav .play{margin-left:auto;background:var(--red);border-color:var(--red);color:var(--on-red)}
.foot{font-size:12px;color:var(--muted);max-width:80ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-eye" viewBox="0 0 48 48"><path d="M4 24C12 12 36 12 44 24C36 36 12 36 4 24Z"/><circle cx="24" cy="24" r="6"/></symbol>
  <symbol id="i-door" viewBox="0 0 48 48"><rect x="12" y="6" width="24" height="36"/><circle cx="31" cy="25" r="1.6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 48 48"><rect x="8" y="8" width="14" height="14"/><rect x="26" y="8" width="14" height="14"/><rect x="8" y="26" width="14" height="14"/><rect x="26" y="26" width="14" height="14"/></symbol>
  <symbol id="i-tag" viewBox="0 0 48 48"><path d="M6 24L24 6H42V24L24 42Z"/><circle cx="33" cy="15" r="2"/></symbol>
  <symbol id="i-bag" viewBox="0 0 48 48"><path d="M10 16H38L41 42H7Z"/><path d="M17 16V12A7 7 0 0 1 31 12V16"/></symbol>
  <symbol id="i-loop" viewBox="0 0 48 48"><path d="M38 24A14 14 0 1 1 30 11"/><path d="M30 5V12H37"/></symbol>
</svg>

<div class="wrap">
  <header class="head">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="31" rx="10" ry="8"/><circle cx="11" cy="22" r="4.5"/><circle cx="19" cy="14" r="4.5"/><circle cx="29" cy="14" r="4.5"/><circle cx="37" cy="22" r="4.5"/></svg>
      <div><small>THE BEAR HOUSE</small><h1>CRM journey</h1></div>
    </div>
    <span class="tag">Illustrative figures</span>
  </header>

  <section class="card journey" aria-label="Customer journey">
    <div class="jgrid" id="jgrid"></div>
    <div class="loop" aria-hidden="true">
      <svg viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M91.67 0 C91.67 34 8.33 34 8.33 0"/></svg>
      <span class="la">▲</span><span class="lt">Repeat visit</span>
    </div>
  </section>

  <section class="stage">
    <div class="shots" id="shots"></div>
    <aside class="panel" aria-live="polite">
      <div class="ph"><span class="pn" id="pn">01</span><div><h2 id="pname"></h2><p id="pwho"></p></div></div>
      <div><div class="eyebrow">VM touchpoints</div><ul class="chips" id="chips"></ul></div>
      <div class="kpi">
        <div class="eyebrow" id="kl"></div>
        <div class="kv" id="kv"></div>
        <div class="track" id="ktrack"><div class="kfill" id="kfill"></div><div class="ktick" id="ktick"></div></div>
        <div class="krow"><span id="ktg"></span><span class="kchip" id="kchip"></span></div>
      </div>
      <div class="nav">
        <button id="prev" aria-label="Previous stage">‹</button>
        <button id="next" aria-label="Next stage">›</button>
        <button id="play" class="play">▶ Tour</button>
      </div>
    </aside>
  </section>

  <p class="foot">Store photos show Bear House displays. Metrics are illustrative, not Bear House data.</p>
</div>

    img.src=IMG[im.k];img.alt=im.alt;img.decoding='async';box.appendChild(img);
    im.pins.forEach(function(p){
      no++;var n=no;
      var pb=el('button','pin '+p[3]);pb.type='button';pb.setAttribute('data-n',n);pb.setAttribute('aria-label',p[2]);
      pb.style.left=(p[0]*100)+'%';pb.style.top=(p[1]*100)+'%';
      pb.appendChild(el('b',null,String(n)));pb.appendChild(el('span',null,p[2]));
      var li=el('li');li.setAttribute('data-n',n);li.appendChild(el('b',null,String(n)));li.appendChild(document.createTextNode(p[2]));
      [pb,li].forEach(function(e){
        e.addEventListener('mouseenter',function(){hot(n,true)});
        e.addEventListener('mouseleave',function(){hot(n,false)});
      });
      pb.addEventListener('focus',function(){hot(n,true)});
      pb.addEventListener('blur',function(){hot(n,false)});
      box.appendChild(pb);chips.appendChild(li);
    });
    sh.appendChild(box);
  });
  var k=s.k;
  $('kl').textContent=k.l;
  $('kv').textContent=k.u==='₹'?'₹'+k.v.toLocaleString('en-IN'):k.v+'%';
  var chip=$('kchip');
  if(k.t!=null){
    $('ktrack').hidden=false;
    $('kfill').style.width=k.v+'%';$('ktick').style.left=k.t+'%';
    var d=k.v-k.t;
    $('ktg').textContent='Target '+k.t+'%';
    chip.textContent=d>=0?'▲ On target':'▼ '+(-d)+' pts below';
    chip.className='kchip '+(d>=0?'ok':'bad');
  }else{
    $('ktrack').hidden=true;$('ktg').textContent='Assumed bill';
    chip.textContent='Basket offers';chip.className='kchip';
  }
}
function go(i){
  var sh=$('shots');
  if(i===cur){return}
  sh.classList.add('fade');
  setTimeout(function(){cur=i;render();sh.classList.remove('fade')},170);
}
function stop(){
  if(timer){clearInterval(timer);timer=null}
  $('play').textContent='▶ Tour';
}
function play(){
  if(timer){stop();return}
  $('play').textContent='❚❚ Pause';
  go((cur+1)%ST.length);
  timer=setInterval(function(){go((cur+1)%ST.length)},4800);
}
$('prev').onclick=function(){stop();go((cur+ST.length-1)%ST.length)};
$('next').onclick=function(){stop();go((cur+1)%ST.length)};
$('play').onclick=play;
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){stop();go((cur+1)%ST.length)}
  if(e.key==='ArrowLeft'){stop();go((cur+ST.length-1)%ST.length)}
});
buildRail();render();
})();
</script>
